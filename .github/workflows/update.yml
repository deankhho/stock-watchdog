# 網站「🔄 觸發更新」按鈕 → 本 workflow 的 Run workflow（需登入 GitHub）
# 注意：goodinfo 可能封鎖 GitHub 雲端 IP——首跑驗證；若被擋，雲端只更新官方名單+回測，
# 淨值需在家用機跑 update.sh（STATUS.md 記錄實測結果）
name: 更新預警資料
on:
  workflow_dispatch:
  schedule:
    # UTC 04:00 = 台灣 12:00。GitHub 排程實測會延遲 1.5~3 小時，所以實際多半落在台灣 13:30~15:00
    # （已過 13:30 收盤，股價是收盤價）。
    # 為什麼從 18:30 改到這裡：2026-08-10 調閱 7/15 以來 19 次 run 的 log，goodinfo 失敗 17 次
    # 全部發生在台灣 19:52 之後，兩次成功在 12:38 與 19:21 —— 舊排程加上延遲剛好整批落進失敗時段。
    # ⚠️ 成功樣本只有 2 次，這是合理推測不是定論；若改了仍持續失敗，就是別的原因。
    - cron: "0 4 * * 1-5"

permissions:
  contents: write

# runtime 因新增 fetch_netvalue_history 而拉長，排程與手動 workflow_dispatch 有機會重疊，
# 會競爭 FinMind 額度、data/ 快取與 git push → 排隊而非並行（見計畫第7節「併發防護」）
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝依賴
        run: |
          pip install playwright pandas requests lxml
          playwright install chromium --with-deps
      - name: 自我檢查（selftest）
        run: |
          python analyze.py --selftest
          python fetch_goodinfo.py --selftest
          python fetch_official.py --selftest
          python backtest.py --selftest
          python crossings.py --selftest
          python fetch_netvalue_history.py --selftest
          python fetch_audit.py --selftest
          python fetch_sbl.py --selftest

      # goodinfo 自 2026-07-15 起封鎖 Actions 雲端 IP。失敗不讓 run 變紅（天天紅燈＝狼來了），
      # 但一定要留下痕跡：Actions 註記 + job summary + 網站上的資料年齡橫幅。
      # 舊寫法 `python fetch_goodinfo.py || echo "..."` 把離開碼整個吞掉，
      # 結果 8/3~8/6 四個綠勾其實都沒更新淨值，靜默停擺 27 天沒人發現。
      - name: 抓淨值（goodinfo，失敗不阻斷）
        id: nv
        run: |
          # Actions 環境用 playwright 內建 chromium（無系統 chrome）
          sed -i 's|CHROME = "/usr/bin/google-chrome"|CHROME = None|' fetch_goodinfo.py
          sed -i 's|executable_path=CHROME, ||' fetch_goodinfo.py
          if python fetch_goodinfo.py; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=goodinfo 抓取失敗::沿用上次 netvalue.json。淨值資料會逐日變舊，請在家用機執行 update.sh 補資料。"
          fi

      - name: 抓官方名單與生成網站
        run: |
          python fetch_official.py
          python fetch_sbl.py || echo "⚠️ 借券標的清單抓取失敗，沿用舊資料（sbl.json state 會標記 degraded/empty）"
          python analyze.py
          # fetch_netvalue_history／fetch_audit／backtest 三者互不依賴，順序不拘（各自獨立資料源）；
          # 失敗不阻斷（P1 超額不 hard fail 是腳本自己的設計，這裡的 || 是防未預期例外；
          # fetch_audit 的降級狀態寫在 audit.json 檔案本身，不靠這裡的 exit code）
          python fetch_netvalue_history.py || echo "⚠️ 淨值歷史抓取失敗，沿用舊快取（dropped 頁籤可能顯示較多 unknown）"
          python fetch_audit.py || echo "⚠️ 會計師查核意見抓取失敗，沿用舊資料"
          python backtest.py
          python fetch_listing_dates.py
          python gen_site.py

      - name: 資料新鮮度回報
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/report.json"))
          nv, off = r["nv_age_days"], r["official_age_days"]
          icon = "🔴" if nv >= 10 else ("⚠️" if nv >= 5 else "✅")
          print(f"### 資料新鮮度\n")
          print(f"| 項目 | 最後更新 | 已幾天 |")
          print(f"|---|---|---|")
          print(f"| 淨值（goodinfo） | {r['nv_fetched_at'][:16]} | {icon} {nv} 天 |")
          print(f"| 官方名單 | {r['official_fetched_at'][:16]} | {off} 天 |")
          for k, v in (r.get("degraded") or {}).items():
              print(f"| ⚠️ {k}（降級） | {(v.get('source_fetched_at') or '?')[:16]} | 沿用舊資料 |")
          PY
          NV=$(python -c "import json;print(json.load(open('data/report.json'))['nv_age_days'])")
          if [ "$NV" -ge 10 ]; then
            echo "::warning title=淨值資料過期::已 $NV 天未更新，網站上的預測欄位不可信，請在家用機執行 update.sh。"
          fi
          if [ "$(python -c "import json;print(len(json.load(open('data/report.json')).get('degraded') or {}))")" != "0" ]; then
            echo "::warning title=官方資料降級::部分次要來源抓取失敗，已沿用舊資料（詳見 job summary）。"
          fi
      - name: 新財報 Email 通知（S9）
        run: |
          COUNT=$(python -c "import json;print(json.load(open('data/report.json'))['new_reports_count'])")
          if [ "$COUNT" -gt 0 ]; then
            echo "偵測到 $COUNT 檔新財報，觸發 GAS 寄信"
            curl -s "https://script.google.com/macros/s/AKfycbwW-9Oy2EJZ8suKmMA1reeYOgZ9NByR_yfSKgmxWSYHl2dMDe7LY-uYjUSuf9zWo6o/exec?token=stockmail2026" || echo "GAS 呼叫失敗（不阻斷流程）"
          else
            echo "無新財報，不寄信"
          fi
      - name: Commit 結果
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data docs
          git commit -m "data: Actions 自動更新 $(date '+%Y-%m-%d %H:%M')" || echo "無變更"
          git push
